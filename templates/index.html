{% extends "base.html" %}

{% block contenido %}

    <h1>Portal de Biblioteca</h1>

    <!-- Si existe la cookie, mostramos el último usuario -->
    # Implementar Jinja y cookies
    {% if ultimo_usuario %}
        <p>Último usuario registrado: {{ ultimo_usuario }}.</p>
        <a href="{{ url_for('eliminar_cookie') }}">Eliminar cookie</a>
    {% else %}
        <p>Bienvenido al Portal de Biblioteca.</p>
    {% endif %}

{% endblock %}
